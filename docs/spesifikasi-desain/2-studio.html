<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF9;--ink:#0B0C0E;--mut:#71717A;--line:#E7E7E9;--sheet:#fff}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#EDEDEF;font:15px/1.5 Inter,-apple-system,sans-serif;color:var(--ink);position:relative}
.sheet{position:absolute;inset:0;background:var(--sheet);display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.hd .x{font:400 22px/1 Inter;color:var(--mut)}
.hd .t{font:600 15px Inter}
.hd .draft{margin-left:auto;font:500 12px Inter;color:var(--mut)}
.cnt{margin:0 16px;padding:10px 0 4px;font:500 12px Inter;color:var(--mut);display:flex;gap:10px;align-items:center}
.cnt .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}
.ttl{width:100%;border:0;outline:0;padding:6px 16px;font:600 21px Inter;letter-spacing:-.02em;background:transparent}
.ttl::placeholder{color:#C4C4C8}
.ed{flex:1;border:0;outline:0;resize:none;padding:6px 16px 16px;font:400 17px/1.72 Newsreader,Georgia,serif;background:transparent;color:#1C1C1F}
.ed::placeholder{color:#C4C4C8;font-family:Inter}
.quote{margin:8px 16px;padding:10px 12px;border-left:3px solid var(--line);font:400 14px/1.6 Newsreader,serif;color:var(--mut)}
.tools{display:flex;align-items:center;gap:4px;padding:10px 12px;border-top:1px solid var(--line);background:#FCFCFC}
.tool{min-width:36px;height:34px;border:0;background:transparent;border-radius:9px;font:600 13px Inter;color:#3F3F46}
.tool.b{font-weight:800}.tool.i{font-style:italic}.tool.u{text-decoration:underline}
.tool.sel{background:#F1F1F2}
.tool.f{font-size:12px;padding:0 8px;min-width:auto;border:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px 22px;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font:600 12px Inter}
.seg span{padding:7px 12px;color:var(--mut)}
.seg .on{background:var(--ink);color:#fff}
.go{margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:650 14px Inter}
.hint{padding:0 16px 12px;font:400 11.5px Inter;color:var(--mut)}
</style></head><body>
<div class="sheet">
  <div class="hd"><div class="x">✕</div><div class="t">Warkah baru</div><div class="draft">Draf tersimpan</div></div>
  <div class="cnt">112 kata <span class="dot"></span> perkiraan baca 40 detik</div>
  <input class="ttl" value="Catatan malam">
  <textarea class="ed">Suara kucing di atap jadi rima yang tak pernah kubayar.

Aku menulis pelan-pelan, seperti orang menutup pintu supaya tidak ada yang terbangun.</textarea>
  <div class="quote"><b>Membalas warkah @uji1:</b> Hari ini aku mulai menulis di sini…</div>
  <div class="tools">
    <button class="tool b">B</button><button class="tool i">I</button><button class="tool u">U</button>
    <button class="tool sel">❝</button>
    <button class="tool f">Newsreader ▾</button>
    <button class="tool" style="margin-left:auto">🖼</button>
  </div>
  <div class="bar">
    <div class="seg"><span>Publik</span><span class="on">Privat</span></div>
    <button class="go">Terbitkan</button>
  </div>
  <div class="hint">Privat: hanya kamu yang bisa membaca. Bisa diubah jadi publik kapan saja.</div>
</div>
</body></html>
