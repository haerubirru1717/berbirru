<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0C0E;--mut:#71717A;--line:#E7E7E9}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:#EDEDEF;font:15px/1.5 Inter,sans-serif;color:var(--ink);position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:#FAFAF9}
.bg .c{height:170px;background:url('/tmp/mockups3/cover.jpg') center/cover}
.bg .a{width:86px;height:86px;border-radius:50%;background:url('/tmp/mockups3/avatar.jpg') center/cover;margin:-40px 0 0 16px;border:3px solid #FAFAF9}
.bg .n{font:500 25px/1.1 Newsreader,serif;padding:10px 16px 0}
.scrim{position:absolute;inset:0;background:rgba(9,9,11,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:10px 0 22px;box-shadow:0 -10px 40px rgba(0,0,0,.22)}
.grab{width:38px;height:4px;border-radius:2px;background:#DDDDE0;margin:0 auto 10px}
.sh{padding:0 18px 12px;border-bottom:1px solid var(--line);position:relative}
.sh .st{font:650 15px Inter}
.sh .hint{font:400 12px Inter;color:var(--mut);margin-top:2px}
.sh .x{position:absolute;right:16px;top:0;color:var(--mut);font-size:18px}
.idn{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.idn .a{width:52px;height:52px;border-radius:50%;background:url('/tmp/mockups3/avatar.jpg') center/cover}
.idn .sn{font:600 15px Inter}
.idn .sa{font:400 12.5px Inter;color:var(--mut)}
.idn .st{margin-left:auto;font:600 11px Inter;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--mut)}
.row{display:flex;padding:12px 18px;font:400 13.5px Inter;border-bottom:1px solid #F3F3F5}
.row .k{color:var(--mut);width:124px}
.row .v{flex:1}
.row .tag{font:600 10.5px Inter;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.stats{display:flex;padding:14px 18px 4px;gap:26px}
.stats div{font:400 12px Inter;color:var(--mut);text-align:center}
.stats b{display:block;font:650 17px Inter;color:var(--ink);font-variant-numeric:tabular-nums}
.note{padding:10px 18px 0;font:400 11.5px Inter;color:var(--mut)}
</style></head><body>
<div class="bg"><div class="c"></div><div class="a"></div><div class="n">uji1</div></div>
<div class="scrim"></div>
<div class="sheet">
 <div class="grab"></div>
 <div class="sh"><div class="st">Informasi Akun</div><div class="hint">Data akunmu di Kitatulis.</div><div class="x">✕</div></div>
 <div class="idn"><div class="a"></div><div><div class="sn">@uji1</div><div class="sa">uji1</div></div><div class="st">Penulis</div></div>
 <div class="row"><div class="k">Nama tampilan</div><div class="v">uji1</div></div>
 <div class="row"><div class="k">Email</div><div class="v">uji1@uji.local</div></div>
 <div class="row"><div class="k">Kota</div><div class="v">Bandung</div></div>
 <div class="row"><div class="k">Bergabung</div><div class="v" style="display:flex;align-items:center;gap:8px">22 Nov 2026 <span class="tag">hanya kamu</span></div></div>
 <div class="stats">
  <div><b>12</b>Karya</div><div><b>84</b>Pengikut</div><div><b>23</b>Mengikuti</div>
 </div>
 <div class="note">Email dan tanggal bergabung tidak pernah ditampilkan di profil publik.</div>
</div>
</body></html>
