name = "kitatulis"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Strix R5 vuln-0001: worker prod tidak boleh terekspos via workers.dev (parallel host
# di luar zone kitatulis.com). Hanya lewat 2 routes zone di bawah.
workers_dev = false

routes = [
  { pattern = "kitatulis.com/*", zone_name = "kitatulis.com" },
  { pattern = "www.kitatulis.com/*", zone_name = "kitatulis.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "berbirru-db"
database_id = "03e44422-b75a-4a7d-8464-41640a5372c8"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "berbirru-media"

[vars]
# Satu-satunya akun yang boleh membuka /owner (putus sengketa + cairkan saldo).
OWNER_EMAIL = "haeru@berbirru.com"
APP_NAME = "KITATULIS"
APP_DOMAIN = "kitatulis.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAFTEI0GwdODJRhtT"
KLIKQRIS_CALLBACK_URL = "https://kitatulis.com/api/klikqris/webhook"
# Strix run-4 followup: Pasar Buku ditutup sementara ("1" = gate aktif). Buka: hapus baris ini → deploy.
PASAR_TUTUP = "1"

[assets]
directory = "./public"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]
